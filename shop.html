<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="探索爐邊卡牌商城的卡牌組合包。">
    <title>商城｜爐邊卡牌</title>
    <link rel="stylesheet" href="index.css?v=coin-icon-20260924">
    <link rel="stylesheet" href="shop-thumbnails.css?v=3d-1">
    <script src="cards-data.js" defer></script>
    <script src="translations-data.js" defer></script>
    <script src="i18n.js?v=coins-20260922" defer></script>
    <script src="catalog-client.js?v=2" defer></script>
    <link rel="stylesheet" href="card-template.css?v=3d-1">
    <script src="card-template.js?v=2" defer></script>
    <script src="card-text-fit.js?v=3d-1" defer></script>
    <script src="card-artwork.js?v=3d-1" defer></script>
    <link rel="stylesheet" href="commerce.css?v=1">
    <script src="commerce.js?v=favorites-page-1" defer></script>
    <script src="shop.js?v=purchase-1" defer></script>
    <script src="account.js?v=coin-icon-20260924" defer></script>
</head>
<body class="shop-page" data-skip-default-title="true">
    <a class="skip" href="#shop">跳至商城</a>
    <header class="navbar">

        <a
            class="logo"
            href="index.html"
        >
            <b>✦</b>

            <span>
                爐邊卡牌

                <small>
                    FIRESIDE CARDS
                </small>
            </span>
        </a>


        <nav aria-label="主要導覽">

            <a
                
                href="index.html#library"
             data-nav-label="library">
                卡牌庫
            </a>

            <a href="shop.html" class="active" aria-current="page" data-nav-label="shop">
                商城
            </a>

        </nav>


        <label class="language-picker">
            <span>Language</span>
            <select id="language" aria-label="Language / 語言 / 言語 / 언어">
                <option value="zh-TW">繁體中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
            </select>
        </label>

        <a
            id="nav-login"
            class="nav-account"
            href="login.html"
        >
            登入
        </a>

        <a
            id="nav-account"
            class="nav-account"
            href="register.html"
        >
            註冊
        </a>

    </header>
    <!-- =========================
         卡包商城
         示意用商城，不含真實金流；組合包內容與價格由 shop.js 插入。
    ========================== -->
    <main
        id="shop"
        class="shop"
        aria-labelledby="shop-heading"
    >

        <div class="shop-inner">

            <div class="section-title">
                <span></span>
                <h1 id="shop-heading">商城</h1>
                <span></span>
            </div>

            <p
                id="shop-intro"
                class="shop-intro"
            ></p>

            <!-- =========================
                 金幣加值面板
                 示意用加值功能：登入後顯示目前金幣餘額與三個固定金額的加值按鈕，
                 點擊後會前往 topup.html 的模擬扣款頁面，不含真實金流。
            ========================== -->
            <div
                id="topup-panel"
                class="topup-panel"
                hidden
            >

                <p
                    id="topup-balance-label"
                    class="topup-balance"
                ></p>

                <p
                    id="topup-panel-intro"
                    class="topup-panel-intro"
                ></p>

                <div class="topup-options">
                    <button class="gold-button topup-option" type="button" data-amount="50">+50</button>
                    <button class="gold-button topup-option" type="button" data-amount="100">+100</button>
                    <button class="gold-button topup-option" type="button" data-amount="150">+150</button>
                </div>

            </div>

            <div
                id="topup-login-hint"
                class="topup-login-hint"
                hidden
            >
                <span id="topup-login-hint-text"></span>
                <a id="topup-login-hint-link" href="login.html"></a>
            </div>

            <div
                id="shop-grid"
                class="shop-grid"
            ></div>

        </div>

    </main>



    <footer id="about">

        <span class="footer-brand">
            ✦ 爐邊卡牌
        </span>

        <p>
            收藏故事，探索下一場冒險。
        </p>

        <small>
            獨立卡牌展示模板 · 非暴雪官方網站
        </small>

    </footer>
    <!-- =========================
         商城組合包詳細資料彈出視窗
    ========================== -->
    <dialog
        id="shop-detail"
        aria-labelledby="shop-detail-title"
    >

        <!-- 關閉按鈕 -->
        <button
            id="close-shop-detail"
            class="close-detail"
            aria-label="關閉組合包詳情"
        >
            ×
        </button>


        <!-- 詳細內容由 JavaScript 插入 -->
        <div id="shop-detail-content"></div>

    </dialog>


</body>
</html>
