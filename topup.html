<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="模擬加值金幣頁面，僅為作品集示意，不會產生真實金流。"
    >

    <title>加值金幣｜爐邊卡牌</title>

    <link
        rel="stylesheet"
        href="index.css?v=coin-icon-20260924"
    >

    <script src="i18n.js?v=coins-20260922" defer></script>
    <link rel="stylesheet" href="commerce.css?v=1">
    <script src="commerce.js?v=nav-active-20260924" defer></script>
    <script src="account.js?v=coin-icon-20260924" defer></script>
    <script src="topup.js?v=1" defer></script>
</head>


<body data-skip-default-title="true">

    <!-- 跳過導覽列，直接前往主要內容 -->
    <a
        class="skip"
        href="#topup-main"
    >
        跳至加值頁面
    </a>


    <!-- =========================
         導覽列（與其他頁面共用同一套樣式／翻譯）
    ========================== -->
    <header class="navbar">

        <a
            class="logo"
            href="index.html"
        >
            <b>✦</b>

            <span>
                爐邊卡牌

                <small>
                    FIRESIDE CARDS
                </small>
            </span>
        </a>


        <nav aria-label="主要導覽">

            <a href="index.html#library" data-nav-label="library">
                卡牌庫
            </a>

            <a href="shop.html" data-nav-label="shop">
                商城
            </a>

        </nav>


        <label class="language-picker">
            <span>Language</span>
            <select id="language" aria-label="Language / 語言 / 言語 / 언어">
                <option value="zh-TW">繁體中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
            </select>
        </label>

        <a
            id="nav-login"
            class="nav-account"
            href="login.html"
        >
            登入
        </a>

        <a
            id="nav-account"
            class="nav-account"
            href="register.html"
        >
            註冊
        </a>

    </header>


    <!-- =========================
         模擬扣款頁面
         示意用：卡號／有效期限／安全碼／持卡人姓名全部唯讀且不可編輯，
         不會蒐集任何真實付款資訊；按下右下角「扣款」才會呼叫 /api/topup，
         效果只有把金幣加進帳號，不會有任何真實金流。
    ========================== -->
    <main id="topup-main">

        <section
            class="register topup"
            aria-label="模擬付款"
        >

            <div class="register-card topup-card">

                <div class="section-title">
                    <span></span>
                    <h1 id="topup-heading">模擬付款</h1>
                    <span></span>
                </div>

                <p
                    id="topup-intro"
                    class="register-intro"
                ></p>

                <!-- 尚未登入時顯示，隱藏付款表單 -->
                <div
                    id="topup-login-required"
                    class="register-signed-in"
                    hidden
                >
                    <p id="topup-login-required-text"></p>

                    <div class="register-signed-in-actions">
                        <a
                            id="topup-login-required-link"
                            class="gold-button"
                            href="login.html"
                        >
                            前往登入
                        </a>
                    </div>
                </div>

                <!-- 加值金額不合法（不在 50/100/150 之內）時顯示 -->
                <div
                    id="topup-invalid"
                    class="register-signed-in"
                    hidden
                >
                    <p id="topup-invalid-text"></p>

                    <div class="register-signed-in-actions">
                        <a
                            class="gold-button"
                            href="shop.html#topup-panel"
                        >
                            返回商城
                        </a>
                    </div>
                </div>

                <!-- 加值成功後顯示 -->
                <div
                    id="topup-success"
                    class="register-signed-in"
                    hidden
                >
                    <p id="topup-success-text"></p>
                    <p id="topup-success-balance"></p>

                    <div class="register-signed-in-actions">
                        <a
                            id="topup-success-back"
                            class="gold-button"
                            href="shop.html"
                        >
                            返回商城
                        </a>
                    </div>
                </div>

                <!-- 模擬扣款表單：所有欄位唯讀，不可編輯，示意用 -->
                <form
                    id="topup-form"
                    novalidate
                >

                    <div class="topup-amount-summary">
                        <span id="topup-amount-label">加值金額</span>
                        <strong id="topup-amount-value"></strong>
                    </div>

                    <div class="field">
                        <label for="topup-field-card-number">
                            <span id="topup-label-card-number">卡號</span>
                        </label>

                        <input
                            id="topup-field-card-number"
                            type="text"
                            value="4242 4242 4242 4242"
                            readonly
                            tabindex="-1"
                            aria-readonly="true"
                        >
                    </div>

                    <div class="topup-field-row">

                        <div class="field">
                            <label for="topup-field-expiry">
                                <span id="topup-label-expiry">有效期限</span>
                            </label>

                            <input
                                id="topup-field-expiry"
                                type="text"
                                value="12 / 29"
                                readonly
                                tabindex="-1"
                                aria-readonly="true"
                            >
                        </div>

                        <div class="field">
                            <label for="topup-field-cvv">
                                <span id="topup-label-cvv">安全碼</span>
                            </label>

                            <input
                                id="topup-field-cvv"
                                type="text"
                                value="•••"
                                readonly
                                tabindex="-1"
                                aria-readonly="true"
                            >
                        </div>

                    </div>

                    <div class="field">
                        <label for="topup-field-cardholder">
                            <span id="topup-label-cardholder">持卡人姓名</span>
                        </label>

                        <input
                            id="topup-field-cardholder"
                            type="text"
                            value="FIRESIDE DEMO"
                            readonly
                            tabindex="-1"
                            aria-readonly="true"
                        >
                    </div>

                    <p
                        id="topup-mock-notice"
                        class="topup-mock-notice"
                    ></p>

                    <p
                        class="form-message"
                        id="topup-form-message"
                        aria-live="polite"
                    ></p>

                    <div class="topup-confirm-row">
                        <button
                            id="topup-confirm"
                            class="gold-button"
                            type="button"
                        >
                            扣款
                        </button>
                    </div>

                </form>

            </div>

        </section>

    </main>


    <!-- =========================
         頁尾（與其他頁面共用同一套樣式／翻譯）
    ========================== -->
    <footer id="about">

        <span class="footer-brand">
            ✦ 爐邊卡牌
        </span>

        <p>
            收藏故事，探索下一場冒險。
        </p>

        <small>
            獨立卡牌展示模板 · 非暴雪官方網站
        </small>

    </footer>

</body>

</html>
