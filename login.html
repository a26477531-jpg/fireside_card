<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="登入爐邊卡牌帳號。"
    >

    <title>登入｜爐邊卡牌</title>

    <link
        rel="stylesheet"
        href="index.css?v=coins-20260922"
    >

    <script src="i18n.js?v=coins-20260922" defer></script>
    <link rel="stylesheet" href="commerce.css?v=1">
    <script src="commerce.js?v=1" defer></script>
    <script src="account.js?v=coins-20260922" defer></script>
    <script src="login.js" defer></script>
</head>


<body data-skip-default-title="true">

    <!-- 跳過導覽列，直接前往主要內容 -->
    <a
        class="skip"
        href="#login-main"
    >
        跳至登入表單
    </a>


    <!-- =========================
         導覽列（與首頁共用同一套樣式／翻譯）
    ========================== -->
    <header class="navbar">

        <a
            class="logo"
            href="index.html"
        >
            <b>✦</b>

            <span>
                爐邊卡牌

                <small>
                    FIRESIDE CARDS
                </small>
            </span>
        </a>


        <nav aria-label="主要導覽">

            <a href="index.html#library" data-nav-label="library">
                卡牌庫
            </a>

            <a href="shop.html" data-nav-label="shop">
                商城
            </a>

        </nav>


        <label class="language-picker">
            <span>Language</span>
            <select id="language" aria-label="Language / 語言 / 言語 / 언어">
                <option value="zh-TW">繁體中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
            </select>
        </label>

        <a
            id="nav-login"
            class="nav-account active"
            href="login.html"
        >
            登入
        </a>

        <a
            id="nav-account"
            class="nav-account"
            href="register.html"
        >
            註冊
        </a>

    </header>


    <!-- =========================
         登入表單
    ========================== -->
    <main id="login-main">

        <section
            class="register"
            aria-label="登入帳號"
        >

            <div class="register-card">

                <div class="section-title">
                    <span></span>
                    <h1 id="login-heading">登入帳號</h1>
                    <span></span>
                </div>

                <p
                    id="login-intro"
                    class="register-intro"
                ></p>

                <!-- 已登入時顯示這裡，表單會被隱藏 -->
                <div
                    id="login-signed-in"
                    class="register-signed-in"
                    hidden
                >
                    <p id="login-signed-in-text"></p>

                    <div class="register-signed-in-actions">
                        <a
                            id="login-go-home"
                            class="gold-button"
                            href="index.html"
                        >
                            返回卡牌庫
                        </a>

                        <button
                            id="login-logout"
                            class="ghost-button"
                            type="button"
                        >
                            登出
                        </button>
                    </div>
                </div>

                <form
                    id="login-form"
                    novalidate
                >

                    <!-- 使用者名稱或 Email -->
                    <div class="field">
                        <label for="field-identifier">
                            <span id="label-identifier">使用者名稱或 Email</span>
                        </label>

                        <input
                            id="field-identifier"
                            name="identifier"
                            type="text"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <!-- 密碼 -->
                    <div class="field">
                        <label for="field-login-password">
                            <span id="label-login-password">密碼</span>
                        </label>

                        <input
                            id="field-login-password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <p
                        class="form-message"
                        id="login-form-message"
                        aria-live="polite"
                    ></p>

                    <button
                        id="submit-login"
                        class="gold-button register-submit"
                        type="submit"
                    >
                        登入
                    </button>

                    <p class="register-switch">
                        <span id="no-account-yet">還沒有帳號？</span>
                        <a
                            id="go-to-register"
                            href="register.html"
                        >
                            前往註冊
                        </a>
                    </p>

                </form>

            </div>

        </section>

    </main>


    <!-- =========================
         頁尾（與首頁共用同一套樣式／翻譯）
    ========================== -->
    <footer id="about">

        <span class="footer-brand">
            ✦ 爐邊卡牌
        </span>

        <p>
            收藏故事，探索下一場冒險。
        </p>

        <small>
            獨立卡牌展示模板 · 非暴雪官方網站
        </small>

    </footer>

</body>

</html>
