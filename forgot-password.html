<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="登入爐邊卡牌帳號。"
    >

    <title>忘記密碼｜爐邊卡牌</title>

    <link
        rel="stylesheet"
        href="index.css?v=coin-icon-20260924"
    >

    <script src="i18n.js?v=coins-20260922" defer></script>
    <link rel="stylesheet" href="commerce.css?v=1">
    <script src="commerce.js?v=purchase-history-20261002" defer></script>
    <script src="account.js?v=coin-icon-20260924" defer></script>
    <meta name="referrer" content="no-referrer">
    <script src="password-recovery.js" defer></script>
</head>


<body data-skip-default-title="true">

    <!-- 跳過導覽列，直接前往主要內容 -->
    <a
        class="skip"
        href="#login-main"
    >
        跳至登入表單
    </a>


    <!-- =========================
         導覽列（與首頁共用同一套樣式／翻譯）
    ========================== -->
    <header class="navbar">

        <a
            class="logo"
            href="index.html"
        >
            <b>✦</b>

            <span>
                爐邊卡牌

                <small>
                    FIRESIDE CARDS
                </small>
            </span>
        </a>


        <nav aria-label="主要導覽">

            <a href="index.html#library" data-nav-label="library">
                卡牌庫
            </a>

            <a href="shop.html" data-nav-label="shop">
                商城
            </a>

        </nav>


        <label class="language-picker">
            <span>Language</span>
            <select id="language" aria-label="Language / 語言 / 言語 / 언어">
                <option value="zh-TW">繁體中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
            </select>
        </label>

        <a
            id="nav-login"
            class="nav-account active"
            href="login.html"
        >
            登入
        </a>

        <a
            id="nav-account"
            class="nav-account"
            href="register.html"
        >
            註冊
        </a>

    </header>


    <!-- =========================
         登入表單
    ========================== -->
    <main id="login-main">

        <section
            class="register"
            aria-label="登入帳號"
        >

            <div class="register-card">

                <div class="section-title">
                    <span></span>
                    <h1 id="login-heading">登入帳號</h1>
                    <span></span>
                </div>

                <p
                    id="login-intro"
                    class="register-intro"
                ></p>

<form id="recovery-form" data-mode="forgot">
 <div class="field"><label id="recovery-label" for="recovery-input"></label>
 <input id="recovery-input" type="email" autocomplete="email" maxlength="254" required></div>
 
 <p id="recovery-message" class="form-message" role="status" aria-live="polite"></p>
 <button id="recovery-submit" class="gold-button register-submit" type="submit"></button>
 <p class="register-switch"><a id="back-login" href="login.html"></a></p>
 </form>
            </div>

        </section>

    </main>


    <!-- =========================
         頁尾（與首頁共用同一套樣式／翻譯）
    ========================== -->
    <footer id="about">

        <span class="footer-brand">
            ✦ 爐邊卡牌
        </span>

        <p>
            收藏故事，探索下一場冒險。
        </p>

        <small>
            獨立卡牌展示模板 · 非暴雪官方網站
        </small>

    </footer>

</body>

</html>
